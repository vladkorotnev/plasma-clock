name: Publish web

# Thanks to github's weird limitations on which branches and/or folders are usable for the pages,
# we need this workaround for `./webroot` to be the actual web root of the project

on:
  push:
      branches: ['pub']
  workflow_dispatch: null

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Publish web pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Copy CNAME
        run: cp ./CNAME ./webroot/CNAME
      - name: Build PoMF Play
        working-directory: helper/pomf-play
        run: |
          npm ci
          npm run build
      - name: Add PoMF Play to the web root
        run: |
          rm -rf ./webroot/pomfplay
          mkdir -p ./webroot/pomfplay
          cp -R ./helper/pomf-play/dist/. ./webroot/pomfplay/
      - name: Publish webroot via GitHub Pages
        uses: rayluo/github-pages-overwriter@v1.3
        with:
          source-directory: webroot
          target-branch: gh-pages
